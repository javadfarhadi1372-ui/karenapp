<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>Karen</title><link rel="manifest" href="manifest.json">
<style>
:root{--p:#0f766e;--p2:#134e4a;--bg:#eef3f2;--m:#64748b;--a:#facc15}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Vazirmatn,sans-serif;background:var(--bg);color:#0f172a;font-size:14px}
header{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}header small{opacity:.85}header img{border-radius:10px}
.layout{display:flex;align-items:flex-start}
nav{display:flex;flex-direction:column;gap:6px;padding:14px 12px;background:#fff;border-left:1px solid #dbe4e2;min-width:168px;position:sticky;top:0;align-self:stretch}
nav button{border:0;background:#e6efed;padding:9px 12px;border-radius:8px;cursor:pointer;font:inherit;text-align:right;width:100%}
nav button.on{background:var(--p);color:#fff}
main{padding:16px;max-width:1100px;margin:0;flex:1;min-width:0}
@media (max-width:720px){.layout{flex-direction:column}nav{flex-direction:row;flex-wrap:wrap;border-left:0;border-bottom:1px solid #dbe4e2;position:static;width:100%}nav button{width:auto}}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px #0001;overflow-x:auto}
table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #e5eceb;text-align:right}th{background:#f3f7f6;font-size:13px}
input,select,textarea{font:inherit;padding:7px;border:1px solid #cbd5d3;border-radius:8px;width:100%}td input,td select{min-width:70px}
button.pri,button.sec,button.dng{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;color:#fff;background:var(--p)}button.sec{background:#475569}button.dng{background:#b91c1c}
a.btn{display:inline-block;text-decoration:none;border-radius:8px;padding:8px 14px;color:#fff;background:#475569}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.k{font-size:20px;font-weight:bold;color:var(--p)}.m{color:var(--m)}
.login{max-width:360px;margin:6vh auto;text-align:center;padding:0 12px}.login .card{padding:24px}.login input{margin:6px 0}
.ok{color:#15803d}.bad{color:#b91c1c}.dev{font-size:22px;letter-spacing:2px;direction:ltr;display:block;background:#f3f7f6;border-radius:8px;padding:8px;margin:6px 0}
.dg{line-height:2;text-align:right}
#print{display:none}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.ov>div{background:#fff;max-width:760px;width:100%;max-height:90vh;overflow:auto;border-radius:12px;padding:14px}.ov label{display:block;margin-top:8px}
@media print{.ov{display:none}#app{display:none}#print{display:block;padding:20px}}
.inv{border:2px solid #000;padding:16px}.inv h2{text-align:center;margin:6px 0}.inv .top{display:flex;justify-content:space-between;align-items:center}.inv .sub{text-align:center;margin:0 0 8px;color:#333}.inv .ft{text-align:center;font-size:11px;color:#666;margin-top:14px}
</style></head><body>
<div id="app"></div><div id="print"></div>
<script src="config.js"></script>

const PR=[];for(let n=2;PR.length<64;n++)if(PR.every(p=>n%p))PR.push(n);
const K256=PR.map(p=>Math.floor((Math.cbrt(p)%1)*4294967296)>>>0),H0=PR.slice(0,8).map(p=>Math.floor((Math.sqrt(p)%1)*4294967296)>>>0);
function sha256(m){const H=H0.slice(),l=m.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);b.set(m);b[l]=128;const dv=new DataView(b.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));const w=new Uint32Array(64);

  for(let t=16;t<64;t++){const a=w[t-15],c=w[t-2];w[t]=(w[t-16]+(((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3))+w[t-7]+(((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10)))>>>0}

async function netReq(url,o={}){const body=o.json!==undefined?JSON.stringify(o.json):null,to=o.timeout||15000,method=o.method||(body?'POST':'GET');
 if(window.native&&window.native.http)return await window.native.http({url,method,headers:body?{'Content-Type':'application/json'}:{},body,timeout:to});
 const ac=new AbortController(),t=setTimeout(()=>ac.abort(),to);
 try{const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body,signal:ac.signal});return{ok:true,status:r.status,body:await r.text()}}
 catch(e){if(e&&e.name=='AbortError')return{ok:false,err:'timeout'};
  if(body){try{await fetch(url,{method:'POST',mode:'no-cors',body,signal:ac.signal});return{ok:true,status:0,opaque:true,body:''}}catch(e2){}}
  return{ok:false,err:String(e&&e.message||e)}}
 finally{clearTimeout(t)}}
async function rb(token,method,data){const r=await netReq(`https://botapi.rubika.ir/v3/${encodeURIComponent(token)}/${method}`,{json:data||{}});
 if(!r.ok)return{ok:false,why:r.err=='timeout'?'timeout':'net'};
 if(r.opaque)return{ok:true,unverified:true};
 let j=null;try{j=JSON.parse(r.body)}catch(e){}
 if(j&&j.status=='OK')return{ok:true,data:j.data};
 if(r.status==401||r.status==403||r.status==404)return{ok:false,why:'token',status:r.status};
 return{ok:false,why:'api',status:r.status,det:j?(j.status_det||j.status||''):('HTTP '+r.status)}}
function whyText(x,what){if(x.ok)return x.unverified?'ارسال شد (در حالت مرورگر تایید دریافت ممکن نیست)':'موفق';
 if(x.why=='net')return 'به سرور روبیکا وصل نشد: اینترنت قطع است یا روبیکا/اینترنت بین‌الملل فیلتر است (VPN را بررسی کنید)';
 if(x.why=='timeout')return 'سرور روبیکا پاسخ نداد (اینترنت کند یا قطع است)';
 if(x.why=='token')return 'توکن ربات اشتباه است یا ربات حذف شده';
 if(x.why=='api')return what=='chat'?'شناسه چت (chat_id) اشتباه است، یا هنوز در روبیکا به ربات پیام نداده‌اید (ابتدا ربات را باز کنید و Start بزنید). '+esc(x.det||''):'روبیکا درخواست را نپذیرفت: '+esc(x.det||'');
 return 'خطای نامشخص'}

async function diagRubika(token,chat,send){const L=[],add=(ok,t)=>L.push(`<div class="${ok?'ok':'bad'}">${ok?'✅':'❌'} ${t}</div>`);

 if(!token){add(0,'توکن ربات روبیکا وارد نشده است.');return L.join('')}
 const g=await rb(token,'getMe');
 if(!g.ok){add(0,whyText(g));return L.join('')}
 add(1,g.unverified?'سرور روبیکا در دسترس است (توکن در حالت مرورگر قابل بررسی نیست).':'سرور روبیکا در دسترس و توکن درست است'+((g.data&&g.data.bot&&(g.data.bot.bot_title||g.data.bot.username))?' — ربات: '+esc(g.data.bot.bot_title||g.data.bot.username):'')+'.');
 if(!chat){add(0,'شناسه چت (chat_id) وارد نشده است. دکمه «پیدا کردن شناسه چت» را بزنید.');return L.join('')}
 if(send){const s=await rb(token,'sendMessage',{chat_id:chat,text:'✅ پیام آزمایشی Karen — اتصال برقرار است'});add(s.ok,s.ok?'پیام آزمایشی ارسال شد؛ روبیکا را بررسی کنید. '+(s.unverified?'(تایید دریافت ممکن نیست)':''):whyText(s,'chat'))}
 return L.join('')}
function collectChats(o,out=new Set()){if(o&&typeof o=='object'){for(const k in o){if(k=='chat_id'&&typeof o[k]=='string')out.add(o[k]);else collectChats(o[k],out)}}return out}

function custDebtLine(){
  const n=(draft.cust||'').trim();if(!n)return '';
  const bal=custBalance(n);if(bal<=0)return '<p class="m" style="color:#15803d">این مشتری بدهی قبلی ندارد.</p>';
  return `<p class="m" style="color:#b91c1c">⚠ بدهی قبلی این مشتری از فاکتورهای قبل: <b>${fmt(bal)}</b> تومان</p>`;
}
function visSel(){if(!me||me.role!='admin')return '';return `<select id="vs" onchange="draft.vis=this.value"><option value="">ویزیتور (اختیاری)</option>${db.users.filter(u=>u.role=='visitor').map(u=>`<option value="${esc(u.u)}" ${u.u==draft.vis?'selected':''}>${esc(u.name)}</option>`).join('')}</select>`}
function docForm(t){
 const opts=db.products.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (${esc(p.unit)}) — موجودی ${fmt(p.stock)}</option>`).join('');
 const rows=draft.rows.map((r,i)=>`<tr><td><select onchange="pick(${i},this.value)"><option value="">انتخاب کالا</option>${opts.replace(`value="${r.id}"`,`value="${r.id}" selected`)}</select></td><td><input type="number" min="0" value="${r.q}" oninput="draft.rows[${i}].q=+this.value;tot()"></td><td><input type="number" min="0" value="${r.price}" oninput="draft.rows[${i}].price=+this.value;tot()"></td><td><button class="dng" onclick="draft.cust=$('#cu').value;draft.rows.splice(${i},1);if(!draft.rows.length)draft.rows.push({id:'',q:1,price:0});render()">×</button></td></tr>`).join('');
 const who=(t=='buy'||t=='pret')?`<input id="cu" list="sl" placeholder="نام تامین‌کننده" value="${esc(draft.cust)}"><datalist id="sl">${db.suppliers.map(x=>`<option>${esc(x.name)}</option>`).join('')}</datalist>`:`<select id="cu" onchange="draft.cust=this.value;render()"><option value="">انتخاب مشتری</option>${db.customers.map(c=>`<option ${c.name==draft.cust?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
 const list=db.docs.filter(d=>d.type==t).slice(-15).reverse().map(d=>`<tr><td>${d.no}</td><td>${d.date}</td><td>${esc(d.cust)}</td>${(t=='sale'||t=='ret')?`<td>${esc(vnm(d))}</td>`:''}<td>${fmt(d.total)}</td><td><button class="sec" onclick="printDoc(${d.no})">چاپ</button> <button class="sec" onclick="editDoc(${d.no})">ویرایش</button> <button class="dng" onclick="delDoc(${d.no})">حذف</button></td></tr>`).join('');
 return `<div class="card"><h3>${draft.edit?'ویرایش '+TY[t]+' شماره '+draft.edit:TY[t]}</h3>${who}${(t=='sale'||t=='ret')?custDebtLine():''}${(t=='sale'||t=='ret')?visSel():''}<table><tr><th>کالا</th><th>تعداد</th><th>قیمت واحد</th><th></th></tr>${rows}</table><p><button class="sec" onclick="draft.cust=$('#cu').value;draft.rows.push({id:'',q:1,price:0});render()">+ ردیف</button> <b>جمع: <span id="tt">${fmt(draft.rows.reduce((a,r)=>a+r.q*r.price,0))}</span></b> <button class="pri" onclick="saveDoc('${t}')">${draft.edit?'ثبت ویرایش':'ثبت'}</button> <button class="sec" onclick="saveDoc('${t}',0,0,1)">${draft.edit?'ثبت ویرایش و چاپ':'ثبت و چاپ'}</button>${draft.edit?` <button class="sec" onclick="draft={rows:[{id:'',q:1,price:0}],cust:''};render()">انصراف</button>`:''}</p></div><div class="card"><h3>آخرین اسناد <small class="m">(برای ویرایش یا حذف، دکمه‌های کنار هر ردیف)</small></h3><table><tr><th>شماره</th><th>تاریخ</th><th>طرف حساب</th>${(t=='sale'||t=='ret')?'<th>ویزیتور</th>':''}<th>جمع</th><th></th></tr>${list}</table></div>`;
}
function pick(i,id){draft.cust=$('#cu').value;const p=prod(id);draft.rows[i].id=id;if(p)draft.rows[i].price=(tab=='buy'||tab=='pret')?p.buy:p.sell;render()}
function tot(){$('#tt').textContent=fmt(draft.rows.reduce((a,r)=>a+r.q*r.price,0))}
function saveDoc(t,by,custName,pr){
 const cust=(custName||$('#cu').value).trim(),items=draft.rows.filter(r=>r.id&&r.q>0).map(r=>({...r,n:(prod(r.id)||{}).name||r.n}));
 if(!cust||!items.length)return alert('طرف حساب و حداقل یک کالا لازم است'),false;
 const st={};db.products.forEach(p=>st[p.id]=p.stock);
 const ed=draft.edit?db.docs.find(d=>d.no==draft.edit):null;
 const pv=(t=='sale'||t=='ret')&&!by&&draft.vis?db.users.find(x=>x.u==draft.vis&&x.role=='visitor'):null;
 const ap=(d,sg)=>d.items.forEach(r=>{if(r.id in st)st[r.id]+=sg*(OUT(d.type)?-1:1)*r.q});
 if(ed)ap(ed,-1);ap({type:t,items},1);
 const bad=db.products.find(p=>st[p.id]<0);if(bad)return alert('موجودی کافی نیست: '+bad.name),false;
 db.products.forEach(p=>p.stock=st[p.id]);
 const total=items.reduce((a,r)=>a+r.q*r.price,0);let no;
 if((t=='buy'||t=='pret')&&!db.suppliers.some(x=>x.name==cust))db.suppliers.push({name:cust,tel:'',addr:''});
 if(ed){Object.assign(ed,{cust,items,total});if(pv){ed.by=pv.u;ed.vn=pv.name}no=ed.no}
 else{no=db.docs.reduce((m,d)=>Math.max(m,d.no),1000)+1;const bu=pv||db.users.find(x=>x.u==(by||me.u));db.docs.push({no,type:t,date:today(),cust,by:pv?pv.u:(by||me.u),vn:bu&&bu.role=='visitor'?bu.name:'',items,total})}
 save();draft={rows:[{id:'',q:1,price:0}],cust:''};render();
 if(pr)printDoc(no);return true;
}
function vnm(d){if(d.vn)return d.vn;const u=db.users.find(x=>x.u==d.by&&x.role=='visitor');return u?u.name:''}
function visTel(d){if(!db.cfg.invVisPhone)return '';const u=db.users.find(x=>x.u==d.by&&x.role=='visitor');const t=u&&u.tel;return t?' ('+esc(t)+')':''}
function invHtml(d){const sup=d.type=='buy'||d.type=='pret';
 const sz=db.cfg.invSize||'A4',or=db.cfg.invOrient||'portrait';
 const pageCss=`<style>@page{size:${sz} ${or};margin:10mm}</style>`;
 return `${pageCss}<div class="inv"><div class="top">${LOGO(80)}<div><b>${TY[d.type]}</b><br>شماره: ${d.no}<br>تاریخ: ${d.date}</div></div><h2>${esc(co())}</h2>${(db.cfg.cphone||db.cfg.caddr)?`<p class="sub">${esc(db.cfg.caddr||'')}${db.cfg.cphone&&db.cfg.caddr?' — ':''}${db.cfg.cphone?'تلفن: '+esc(db.cfg.cphone):''}</p>`:''}<p>${sup?'تامین‌کننده':'خریدار'}: <b>${esc(d.cust)}</b>${vnm(d)?` &nbsp;|&nbsp; ویزیتور: <b>${esc(vnm(d))}${visTel(d)}</b>`:''}</p><table><tr><th>ردیف</th><th>شرح کالا</th><th>تعداد</th><th>قیمت واحد</th><th>مبلغ</th></tr>${d.items.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n||(prod(r.id)||{}).name)}</td><td>${r.q}</td><td>${fmt(r.price)}</td><td>${fmt(r.q*r.price)}</td></tr>`).join('')}<tr><th colspan="4">جمع کل</th><th>${fmt(d.total)}</th></tr></table>${db.cfg.invCard&&db.cfg.cardNo?`<p class="sub" dir="ltr" style="text-align:center;margin-top:10px">شماره کارت جهت واریز: ${esc(db.cfg.cardNo)}</p>`:''}${db.cfg.invSign?`<br><br><div style="display:flex;justify-content:space-around"><span>امضای فروشنده</span><span>امضای خریدار</span></div>`:''}<div class="ft">صادر شده با Karen</div></div>`}
function printDoc(no){const d=db.docs.find(x=>x.no==no);if(!d)return;$('#print').innerHTML=invHtml(d);setTimeout(()=>window.print(),150)}
function viewDoc(no){const d=db.docs.find(x=>x.no==no);if(!d)return;closeDlg();const m=document.createElement('div');m.className='ov dlg';m.innerHTML=`<div>${invHtml(d)}<p style="text-align:center"><button class="pri" onclick="printDoc(${no})">چاپ</button> <button class="sec" onclick="closeDlg()">بستن</button></p></div>`;document.body.appendChild(m)}

const cleanCust=c=>typeof c=='string'?{name:c}:c;
function packet(u){const v=db.users.find(x=>x.u==u);if(!v)return '';
 return 'KARENPKT:'+JSON.stringify({at:today(),company:co(),me:{u:v.u,p:v.p,name:v.name},rb:{token:db.cfg.token||'',chat:db.cfg.chat||''},
  stock:db.products.map(p=>({id:p.id,name:p.name,unit:p.unit,sell:p.sell,stock:p.stock})),
  custs:db.customers.filter(c=>!c.vis||c.vis==u).map(c=>({name:c.name,tel:c.tel||'',addr:c.addr||'',lat:c.lat,lng:c.lng})),
  vis:{[u]:visTot(u)},docs:db.docs.filter(d=>d.by==u).slice(-40).reverse().map(d=>({no:d.no,type:d.type,date:d.date,cust:d.cust,total:d.total}))})}
function importPacket(text){const t=String(text||'').trim(),m=t.match(/KARENPKT:(.*)/)||[null,t];let s;try{s=JSON.parse(m[1])}catch(e){return alert('متن نامعتبر است. کل پیام مدیر را کپی کنید.')}
 if(!s||!s.stock)return alert('متن نامعتبر است.');
 s.custs=(s.custs||[]).map(cleanCust);db.snap=s;
 if(s.me&&s.me.u){const o=db.users.find(x=>x.u==s.me.u);if(o){o.p=s.me.p;o.name=s.me.name}else db.users.push({u:s.me.u,p:s.me.p,name:s.me.name,role:'visitor'})}
 if(s.rb&&s.rb.token){db.cfg.token=s.rb.token;db.cfg.chat=s.rb.chat||db.cfg.chat}
 save();closeDlg();render();alert('اطلاعات دریافت شد.'+(s.me?' اکنون می‌توانید با نام کاربری و رمز خود وارد شوید.':''))}
function packetDlg(){closeDlg();const m=document.createElement('div');m.className='ov dlg';m.innerHTML=`<div style="max-width:480px"><h3>دریافت اطلاعات از مدیر</h3><p class="m">پیامی را که مدیر در روبیکا برایتان فرستاده (شروع با KARENPKT) کپی و اینجا بچسبانید.</p><textarea id="pk" rows="6" dir="ltr"></textarea><p><button class="pri" onclick="importPacket($('#pk').value)">ثبت</button> <button class="sec" onclick="closeDlg()">بستن</button></p></div>`;document.body.appendChild(m)}
function snapBox(){return `<div class="card"><p class="m">برای به‌روزرسانی موجودی، مشتریان و گزارش‌ها، پیام جدید مدیر را اینجا بچسبانید${db.snap?' (آخرین به‌روزرسانی: '+esc(db.snap.at)+')':''}:</p><textarea id="sp" rows="2" dir="ltr"></textarea><p><button class="pri" onclick="importPacket($('#sp').value)">به‌روزرسانی</button></p></div>`}

/* ---------- ارسال سفارش/مشتری از ویزیتور به روبیکا ---------- */
async function rubikaSend(text){const c=db.cfg;if(!c.token||!c.chat)return{ok:false,msg:'توکن ربات و شناسه چت هنوز تنظیم نشده. از مدیر بخواهید بسته اطلاعات را دوباره بفرستد، یا در «اطلاعات و تنظیمات» وارد کنید.'};
 if(!navigator.onLine)return{ok:false,msg:'اینترنت قطع است'};
 const r=await rb(c.token,'sendMessage',{chat_id:c.chat,text});return{ok:r.ok,msg:whyText(r,'chat')}}
async function sendOrder(){
 const items=draft.rows.filter(r=>r.id&&r.q>0),cust=$('#cu').value.trim(),reg=$('#rg').value.trim();
 if(!cust||!reg||!items.length)return alert('مشتری، منطقه و حداقل یک کالا لازم است');
 if(!allCust().some(c=>c.name==cust)){db.vcust.push({name:cust,tel:'',addr:reg,sent:false})}
 const o={oid:me.u+'-'+Date.now(),v:me.u,vn:(db.cfg.profile&&db.cfg.profile.name)||me.name,cust,region:reg,date:today(),items:items.map(r=>({id:r.id,name:(db.snap.stock.find(s=>s.id==r.id)||{}).name,q:r.q}))};
 o.text=orderText(o);const rs=await rubikaSend(o.text);db.orders.push({...o,sent:rs.ok,status:'new'});save();
 if(rs.ok){draft={rows:[{id:'',q:1,price:0}],cust:''};tab='myorders';render();alert('سفارش به روبیکا ارسال شد ✅')}
 else{await copyText(o.text);draft={rows:[{id:'',q:1,price:0}],cust:''};tab='myorders';render();alert('سفارش ذخیره شد ولی ارسال نشد: '+rs.msg+'\nمتن سفارش کپی شد؛ می‌توانید دستی در روبیکا بفرستید یا بعدا از «سفارش‌های من» دوباره ارسال کنید.')}}
const orderText=o=>`🛒 سفارش جدید\nویزیتور: ${o.vn}\nمنطقه: ${o.region}\nمشتری: ${o.cust}\n`+o.items.map(i=>`• ${i.name} × ${i.q}`).join('\n')+`\n\nORDERJSON:${JSON.stringify({oid:o.oid,v:o.v,vn:o.vn,cust:o.cust,region:o.region,date:o.date,items:o.items})}`;
async function resendOrder(i){const o=db.orders[i];const rs=await rubikaSend(o.text||orderText(o));if(rs.ok){o.sent=true;save();render();alert('ارسال شد ✅')}else alert('ارسال نشد: '+rs.msg)}
async function sendCusts(){const L=db.vcust.filter(c=>!c.sent);if(!L.length)return alert('مشتری جدیدی برای ارسال نیست');
 const arr=L.map(c=>{const l=loc(c);return{name:c.name,tel:c.tel||'',addr:c.addr||'',lat:l?l.lat:null,lng:l?l.lng:null,v:me.u,vn:me.name}});
 const txt='👤 مشتری جدید از '+me.name+'\n'+arr.map(c=>'• '+c.name+(c.tel?' — '+c.tel:'')).join('\n')+'\n\nCUSTJSON:'+JSON.stringify(arr);
 const rs=await rubikaSend(txt);if(rs.ok){L.forEach(c=>c.sent=true);save();render();alert('مشتریان به مدیر ارسال شد ✅')}else{await copyText(txt);alert('ارسال نشد: '+rs.msg+'\nمتن کپی شد؛ می‌توانید دستی در روبیکا بفرستید.')}}

/* ---------- دریافت سفارش/مشتری در برنامه مدیر ---------- */
function importText(t){let no=0,nc=0,bad=0;const T=String(t||'');
 for(const m of T.matchAll(/ORDERJSON:(.*)/g)){try{const o=JSON.parse(m[1].trim());if(o.oid&&db.orders.some(x=>x.oid==o.oid))continue;db.orders.push({...o,status:'new'});no++}catch(e){bad++}}
 for(const m of T.matchAll(/CUSTJSON:(.*)/g)){try{JSON.parse(m[1].trim()).forEach(c=>{if(!c.name||db.customers.some(x=>x.name==c.name))return;db.customers.push({id:nextCid(),name:c.name,tel:c.tel||'',addr:c.addr||'',lat:c.lat??undefined,lng:c.lng??undefined,vis:c.v||''});nc++})}catch(e){bad++}}
 if(!no&&!nc&&!bad)return alert('سفارش یا مشتری معتبری در متن پیدا نشد (یا قبلا ثبت شده است)');
 save();render();alert(`ثبت شد: ${no} سفارش، ${nc} مشتری جدید`+(bad?`\n${bad} مورد نامعتبر نادیده گرفته شد`:''))}
async function importClip(){let t='';try{t=await navigator.clipboard.readText()}catch(e){return alert('خواندن کلیپ‌بورد ممکن نیست؛ متن را در کادر بچسبانید.')}importText(t)}
function custBalance(name){
  const sales=db.docs.reduce((s,d)=>s+((d.type=='sale'&&d.cust==name)?d.total:(d.type=='ret'&&d.cust==name)?-d.total:0),0);
  const paid=(db.payments||[]).filter(p=>p.cust==name).reduce((s,p)=>s+p.amount,0);
  return sales-paid;
}
async function payCust(i){
  const c=db.customers[i],bal=custBalance(c.name);
  const r=await dlg('ثبت دریافتی از '+c.name,[{label:'بدهی فعلی: '+fmt(bal)+' — مبلغ دریافتی',type:'number'},{label:'تاریخ',val:today()},{label:'توضیح (اختیاری)'}]);
  if(!r)return;const amt=+r[0]||0;if(amt<=0)return alert('مبلغ نامعتبر است');
  db.payments.push({id:(db.payments.reduce((m,p)=>Math.max(m,p.id||0),0)+1),cust:c.name,amount:amt,date:r[1].trim()||today(),note:r[2].trim(),by:(me&&me.u)||''});
  save();render();
}
const nextCid=()=>String(db.customers.reduce((m,c)=>Math.max(m,+c.id||0),699)+1);
async function order2doc(i){const o=db.orders[i];
 if(!db.customers.find(c=>c.name==o.cust))db.customers.push({id:nextCid(),name:o.cust,tel:'',addr:o.region||'',vis:o.v||''});
 const old=draft;draft={cust:o.cust,rows:o.items.map(x=>({id:x.id,q:x.q,price:(prod(x.id)||{}).sell||0}))};
 const missing=o.items.find(x=>!prod(x.id));if(missing){draft=old;return alert('کالای «'+missing.name+'» در انبار وجود ندارد')}
 const ok=saveDoc('sale',o.v,o.cust);if(ok){o.status='done';save();render()}else draft=old}

let sv='',arq='',aty='',alim=100,CL=[],rf='today',gpos=null,gtry=0,gerr='';
function syncDraft(){if($('#cu'))draft.cust=$('#cu').value;if($('#rg'))draft.region=$('#rg').value}

const dist=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),q=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(q))};
function getPos(){return new Promise(res=>{if(!navigator.geolocation){gerr='این دستگاه GPS را پشتیبانی نمی‌کند';return res(null)}
 navigator.geolocation.getCurrentPosition(p=>{gpos={lat:p.coords.latitude,lng:p.coords.longitude};gerr='';res(gpos)},e=>{gerr=e.code==1?'دسترسی به موقعیت مکانی مجاز نشده است؛ GPS را در تنظیمات گوشی برای Karen فعال کنید':'موقعیت شما مشخص نشد (GPS را روشن کنید)';res(null)},{enableHighAccuracy:true,timeout:15000,maximumAge:30000})})}
const dayOf=n=>(db.cfg.days||{})[n]??'';
const loc=c=>(db.cfg.locs||{})[c.name]||(c.lat!=null&&c.lat!==''&&c.lat!==undefined?{lat:+c.lat,lng:+c.lng}:null);
function allCust(){const m=new Map();((db.snap&&db.snap.custs)||[]).forEach(c=>{c=cleanCust(c);m.set(c.name,{...c,src:'admin'})});(db.vcust||[]).forEach(c=>m.set(c.name,{...c,src:'mine'}));return[...m.values()]}
const mapUrl=(c,l)=>l?`https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}`:(c.addr?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.addr)}`:'');
function routeCard(x){const c=x.c,u=mapUrl(c,x.l);return `<div class="card" style="border:1px solid #dbe4e2"><b>${esc(c.name)}</b> ${x.km!=null?`<span class="m">— ${x.km<1?fmt(Math.round(x.km*1000))+' متر':fmt(Math.round(x.km*10)/10)+' کیلومتر'}</span>`:''}<br><span class="m">${esc(c.addr||'')} ${esc(c.tel||'')}</span><p>${u?`<a class="btn" href="${u}" target="_blank">مسیریابی</a> `:''}${c.tel&&/\d{7}/.test(norm(c.tel))?`<a class="btn" href="tel:${esc(norm(c.tel).replace(/[^\d+]/g,''))}">تماس</a> `:''}<button class="pri" onclick="orderFor(${x.i})">ثبت سفارش</button> <button class="sec" onclick="setLoc(${x.i})">ثبت موقعیت فعلی برای این مشتری</button></p></div>`}
function custRows(L){return L.length?`<table><tr><th>نام</th><th>تلفن/آدرس</th><th>روز مراجعه</th><th>موقعیت</th><th></th></tr>${L.map((c,i)=>`<tr><td>${esc(c.name)}${c.src=='mine'&&!c.sent?' <small class="bad">(ارسال نشده)</small>':''}</td><td>${esc(c.tel||'')} ${esc(c.addr||'')}</td><td><select style="min-width:90px" onchange="setDay(${i},this.value)"><option value="">—</option>${DORD.map(d=>`<option value="${d}" ${String(dayOf(c.name))==String(d)?'selected':''}>${DAYS[d]}</option>`).join('')}</select></td><td>${loc(c)?'✅':'—'} <button class="sec" onclick="setLoc(${i})">ثبت موقعیت من</button></td><td>${c.src=='mine'?`<button class="dng" onclick="delVCust(${i})">حذف</button>`:''}</td></tr>`).join('')}</table>`:'<p class="m">مشتری‌ای ثبت نشده.</p>'}
function setDay(i,d){const c=CL[i];db.cfg.days=db.cfg.days||{};if(d==='')delete db.cfg.days[c.name];else db.cfg.days[c.name]=d;save()}
async function setLoc(i){const c=CL[i];const p=await getPos();if(!p)return alert(gerr||'موقعیت مشخص نشد');db.cfg.locs=db.cfg.locs||{};db.cfg.locs[c.name]={lat:p.lat,lng:p.lng};const v=db.vcust.find(x=>x.name==c.name);if(v)v.sent=false;save();render();alert('موقعیت فعلی برای «'+c.name+'» ثبت شد')}
async function addVCust(){const n=$('#vn').value.trim();if(!n)return alert('نام مشتری لازم است');if(allCust().some(c=>c.name==n))return alert('این مشتری قبلا ثبت شده');
 db.vcust.push({name:n,tel:$('#vt').value.trim(),addr:$('#va').value.trim(),sent:false});const d=$('#vd').value;if(d!==''){db.cfg.days=db.cfg.days||{};db.cfg.days[n]=d}
 if($('#vg').checked){const p=await getPos();if(p){db.cfg.locs=db.cfg.locs||{};db.cfg.locs[n]={lat:p.lat,lng:p.lng}}else alert('مشتری ثبت شد ولی موقعیت مشخص نشد: '+gerr)}
 save();render()}
function delVCust(i){const c=CL[i];if(!confirm('«'+c.name+'» حذف شود؟'))return;db.vcust=db.vcust.filter(x=>x.name!=c.name);save();render()}
function orderFor(i){const c=CL[i];tab='neworder';draft={rows:[{id:'',q:1,price:0}],cust:c.name,region:c.addr||''};render()}
function saveProf(){db.cfg.profile={name:$('#pn').value.trim(),phone:$('#pp').value.trim(),area:$('#pa').value.trim()};save();alert('ذخیره شد')}
async function testBot2(){db.cfg={...db.cfg,token:$('#tk').value.trim(),chat:$('#ch').value.trim()};save();info('نتیجه بررسی اتصال',await diagRubika(db.cfg.token,db.cfg.chat,true))}
async function testBot(){saveBot(true);info('نتیجه بررسی اتصال',await diagRubika(db.cfg.token,db.cfg.chat,true))}
function saveBot(q){db.cfg={...db.cfg,token:$('#ot').value.trim(),chat:$('#oc').value.trim()};save();if(!q)alert('ذخیره شد')}
function saveCo(){db.cfg.company=$('#co1').value.trim();db.cfg.cphone=$('#co2').value.trim();db.cfg.caddr=$('#co3').value.trim();save();alert('اطلاعات شرکت ذخیره شد');render()}
function saveInv(){
  db.cfg.invOrient=$('#iv1').value;db.cfg.invSize=$('#iv2').value;
  db.cfg.invCard=$('#iv3').checked;db.cfg.cardNo=$('#iv4').value.trim();
  db.cfg.invVisPhone=$('#iv5').checked;db.cfg.invSign=$('#iv6').checked;
  save();alert('تنظیمات فاکتور ذخیره شد');render();
}
function saveChan(){db.cfg={...db.cfg,rbToken:$('#rt').value.trim(),rbChat:$('#rc').value.trim(),smsKey:$('#ak').value.trim()};save();alert('ذخیره شد')}

/* ---------- مدیریت کالا/مشتری/تامین‌کننده/ویزیتور ---------- */
function addProd(){const n=$('#n1').value.trim();if(!n)return;db.products.push({id:String(db.products.reduce((m,p)=>Math.max(m,+p.id||0),1000)+1),name:n,group:$('#n2').value,unit:$('#n3').value,buy:+$('#n4').value,sell:+$('#n5').value,stock:0});save();render()}
async function delDoc(no){const i=db.docs.findIndex(d=>d.no==no);if(i<0)return;const d=db.docs[i],sg=OUT(d.type)?1:-1;
 if(sg<0)for(const r of d.items){const p=prod(r.id);if(p&&p.stock<r.q)return alert('موجودی «'+p.name+'» برای حذف این سند کافی نیست')}
 if(!await auth())return;if(!confirm('سند شماره '+no+' حذف شود؟ موجودی انبار به حالت قبل برمی‌گردد.'))return;
 const j=db.docs.findIndex(x=>x.no==no);if(j<0)return;d.items.forEach(r=>{const p=prod(r.id);if(p)p.stock+=sg*r.q});db.docs.splice(j,1);save();render()}
function setStock(i,v){const p=db.products[i],n=+v;if(v===''||isNaN(n)||n<0){render();return alert('عدد معتبر وارد کنید')}
 if(n!=p.stock&&confirm('موجودی «'+p.name+'» از '+p.stock+' به '+n+' تغییر کند؟'))p.stock=n,save();render()}
async function editProd(i){const p=db.products[i],r=await dlg('ویرایش کالا',[{label:'نام کالا',val:p.name},{label:'گروه',val:p.group},{label:'واحد',val:p.unit},{label:'قیمت خرید',val:p.buy,type:'number'},{label:'قیمت فروش',val:p.sell,type:'number'}]);if(!r)return;
 p.name=r[0].trim()||p.name;p.group=r[1];p.unit=r[2]||p.unit;p.buy=+r[3]||0;p.sell=+r[4]||0;save();render()}
function delProd(i){const p=db.products[i];if(db.docs.some(d=>d.items.some(r=>r.id==p.id)))return alert('این کالا در اسناد استفاده شده و قابل حذف نیست');if(confirm('«'+p.name+'» حذف شود؟')){db.products.splice(i,1);save();render()}}
function addCust(){const n=$('#c1').value.trim();if(!n)return alert('نام مشتری لازم است');if(db.customers.some(c=>c.name==n))return alert('این مشتری قبلا ثبت شده');db.customers.push({id:nextCid(),name:n,tel:$('#c2').value.trim(),addr:$('#c3').value.trim(),vis:$('#c4').value});save();render()}
async function editCust(i){const c=db.customers[i],vs=db.users.filter(u=>u.role=='visitor');const r=await dlg('ویرایش مشتری',[{label:'نام',val:c.name},{label:'تلفن',val:c.tel},{label:'آدرس',val:c.addr||''},{label:'ویزیتور',type:'select',val:c.vis||'',opts:[['','همه'],...vs.map(v=>[v.u,v.name])]},{label:'موقعیت (عرض,طول) مثلا 38.25,48.29',val:c.lat!=null?c.lat+','+c.lng:''}]);if(!r)return;
 const nn=r[0].trim()||c.name;if(nn!=c.name&&db.customers.some(y=>y.name==nn))return alert('نام تکراری است');
 if(nn!=c.name)db.docs.forEach(d=>{if((d.type=='sale'||d.type=='ret')&&d.cust==c.name)d.cust=nn});
 c.name=nn;c.tel=r[1];c.addr=r[2];c.vis=r[3];const m=r[4].replace(/[۰-۹]/g,x=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(x)).split(',').map(Number);if(m.length==2&&m.every(x=>!isNaN(x))){c.lat=m[0];c.lng=m[1]}else if(!r[4].trim()){delete c.lat;delete c.lng}save();render()}
function delCust(i){const c=db.customers[i];if(db.docs.some(d=>(d.type=='sale'||d.type=='ret')&&d.cust==c.name))return alert('برای این مشتری فاکتور ثبت شده و قابل حذف نیست');if(confirm('«'+c.name+'» حذف شود؟')){db.customers.splice(i,1);save();render()}}
function userTaken(n,self){return db.users.some(x=>x!==self&&x.u==n)}
function renameUser(u,nn){const o=u.u;db.docs.forEach(d=>{if(d.by==o)d.by=nn});db.orders.forEach(x=>{if(x.v==o)x.v=nn});db.customers.forEach(c=>{if(c.vis==o)c.vis=nn});u.u=nn}
function addVis(){const u=$('#v2').value.trim(),n=$('#v1').value.trim();if(!u||!n||!$('#v3').value)return alert('نام، نام کاربری و رمز لازم است');if(userTaken(u))return alert('نام کاربری تکراری است');db.users.push({u,p:$('#v3').value,name:n,role:'visitor',tel:($('#v6')?$('#v6').value.trim():''),pct:(+$('#v4').value||0)/100,fix:Math.max(0,+$('#v5').value||0)});save();render()}
async function editVis(i){const u=db.users[i],r=await dlg('ویرایش ویزیتور',[{label:'نام ویزیتور',val:u.name},{label:'نام کاربری',val:u.u},{label:'رمز عبور',val:u.p},{label:'شماره تلفن',val:u.tel||''},{label:'درصد قرارداد (مثلا 3)',val:Math.round(u.pct*10000)/100,type:'number'},{label:'مبلغ ثابت (ریال؛ اگر ندارد 0)',val:u.fix||0,type:'number'}]);if(!r)return;
 const nu=r[1].trim();if(!nu||userTaken(nu,u))return alert('نام کاربری خالی یا تکراری است');if(isNaN(+r[4])||+r[4]<0||+r[4]>100)return alert('درصد نامعتبر است');
 u.name=r[0].trim()||u.name;u.p=r[2]||u.p;u.tel=r[3].trim();u.pct=+r[4]/100;u.fix=Math.max(0,+r[5]||0);if(nu!=u.u)renameUser(u,nu);save();render()}
function delVis(i){const u=db.users[i];if(confirm('ویزیتور «'+u.name+'» حذف شود؟ (اسناد قبلی او در سیستم باقی می‌ماند)')){db.users.splice(i,1);save();render()}}
function saveAdmin(){const nu=$('#nu').value.trim(),np=$('#np').value;if(!nu)return alert('نام کاربری خالی است');if(userTaken(nu,me))return alert('نام کاربری تکراری است');if(nu!=me.u)renameUser(me,nu);if(np)me.p=np;save();alert('ذخیره شد');render()}
function factoryReset(){if($('#rp').value!==me.p)return alert('رمز مدیر اشتباه است');if(!confirm('همه اطلاعات پاک می‌شود. مطمئن هستید؟'))return;db=JSON.parse(SEED_STR);fixDb();save();me=null;tab='';render();alert('برنامه به حالت اولیه برگشت. ورود: admin / welcome')}
async function auth(){if(!db.cfg.askPw)return true;const r=await dlg('رمز مدیر',[{label:'رمز مدیر را وارد کنید',type:'password'}]);if(r&&r[0]===me.p)return true;if(r)alert('رمز اشتباه است');return false}
async function editDoc(no){const d=db.docs.find(x=>x.no==no);if(!d||!await auth())return;tab=d.type;draft={cust:d.cust,edit:no,vis:(db.users.find(x=>x.u==d.by&&x.role=='visitor')||{}).u||'',rows:d.items.map(r=>({...r}))};render();scrollTo(0,0)}
function addSup(){const n=$('#s1').value.trim();if(!n)return alert('نام لازم است');if(db.suppliers.some(x=>x.name==n))return alert('این تامین‌کننده قبلا ثبت شده');db.suppliers.push({name:n,tel:$('#s2').value,addr:$('#s3').value});save();render()}
async function editSup(i){const x=db.suppliers[i],r=await dlg('ویرایش تامین‌کننده',[{label:'نام',val:x.name},{label:'تلفن',val:x.tel},{label:'آدرس',val:x.addr}]);if(!r)return;const nn=r[0].trim()||x.name;if(nn!=x.name&&db.suppliers.some(y=>y.name==nn))return alert('نام تکراری است');if(nn!=x.name)db.docs.forEach(d=>{if((d.type=='buy'||d.type=='pret')&&d.cust==x.name)d.cust=nn});x.name=nn;x.tel=r[1];x.addr=r[2];save();render()}
function delSup(i){if(confirm('«'+db.suppliers[i].name+'» حذف شود؟ (فاکتورهای خرید قبلی می‌ماند)')){db.suppliers.splice(i,1);save();render()}}
function archRows(){const qs=norm(arq).split(/\s+/).filter(Boolean),L=[];
 for(let i=db.docs.length-1;i>=0;i--){const d=db.docs[i];if(aty&&d.type!=aty)continue;
  const h=norm(d.no+' '+d.cust+' '+d.date+' '+d.date.replace(/\b(\d)\b/g,'0$1')+' '+vnm(d)+' '+TY[d.type]);
  if(qs.every(q=>h.includes(q)))L.push(d)}
 return `<p class="m">${fmt(L.length)} فاکتور یافت شد</p><table><tr><th>شماره</th><th>نوع</th><th>تاریخ</th><th>طرف حساب</th><th>ویزیتور</th><th>مبلغ</th><th></th></tr>${L.slice(0,alim).map(d=>`<tr><td>${d.no}</td><td>${TY[d.type]}</td><td>${d.date}</td><td>${esc(d.cust)}</td><td>${esc(vnm(d))}</td><td>${fmt(d.total)}</td><td><button class="sec" onclick="viewDoc(${d.no})">مشاهده</button> <button class="sec" onclick="printDoc(${d.no})">چاپ</button> <button class="sec" onclick="editDoc(${d.no})">ویرایش</button> <button class="dng" onclick="delDoc(${d.no})">حذف</button></td></tr>`).join('')}</table>${L.length>alim?`<p><button class="sec" onclick="alim+=100;$('#al').innerHTML=archRows()">نمایش بیشتر</button></p>`:''}`}
init();
</script></body></html>
